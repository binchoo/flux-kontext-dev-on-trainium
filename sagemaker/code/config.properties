# torchserve config baked into model.tar.gz (code/config.properties). SageMaker's
# pytorch inference toolkit picks this up. The env vars (SAGEMAKER_MODEL_SERVER_
# WORKERS / TS_*) did NOT stop torchserve from spawning many workers on the
# 128-vCPU host; each worker then tried to claim the same 8 TP NeuronCores ->
# NRT_RESOURCE / "Allocation Failure" (cores already owned) -> worker died ->
# retry loop. A TP8 model must have EXACTLY ONE worker owning the 8 cores.
#
# Force a single worker for the model, hard-capped:
default_workers_per_model=1
# Don't let torchserve scale beyond 1.
# (min/max are also pinned via env, but config.properties is authoritative.)
install_py_dep_per_model=true
# Give the ~50s+ Neuron cold load room before torchserve declares the worker dead.
default_response_timeout=900
model_store=/opt/ml/model
load_models=ALL
