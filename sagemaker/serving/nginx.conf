worker_processes 1;
daemon off;  # run in foreground so the `serve` process can supervise it

pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log;

events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log combined;

  upstream gunicorn {
    server unix:/tmp/gunicorn.sock;
  }

  server {
    listen 8080 deferred;       # SageMaker requires the server on :8080
    client_max_body_size 25m;   # SageMaker max payload is 25 MB

    keepalive_timeout 5;
    # A FLUX inference is ~10s but the FIRST request triggers the ~50s model
    # load (lazy). Allow a long read timeout so the proxy doesn't cut it off.
    proxy_read_timeout 1200s;
    proxy_send_timeout 1200s;

    location ~ ^/(ping|invocations) {
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_redirect off;
      proxy_pass http://gunicorn;
    }

    location / {
      return 404 "{}";
    }
  }
}
